<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Scoo logo v2</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#fff;font-family:Inter,sans-serif}
.wrap{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;padding:40px;width:1360px;box-sizing:border-box}
.card{border:2px solid #111;border-radius:24px;padding:24px;display:flex;flex-direction:column;align-items:center;gap:14px;min-height:300px;justify-content:center}
.card.dark{background:#111;border-color:#111}
.card h3{margin:0;font-size:14px;font-weight:600;color:#666;align-self:flex-start}.card.dark h3{color:#aaa}
.lock{display:flex;align-items:center;gap:14px}
.word{font:500 60px 'Space Grotesk';letter-spacing:-1px;color:#111}
.tile{width:150px;height:150px;border-radius:34px;display:grid;place-items:center}
.row{display:flex;gap:26px;align-items:flex-end}.fav{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:#666}
</style></head><body><div class="wrap" id="w"></div>
<script>
// faithful to the sketch: wide lenses, a bridge line running into both lenses,
// one long stretched "s" crossing it as the nose, a small lopsided smile
const M=({ink='#111',smile='#FF6B4A',sw=5,round=false}={})=>`<svg viewBox="0 0 320 210" role="img" aria-label="Scoo glasses face"><g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="${sw}">
${round?`<circle cx="88" cy="96" r="50" stroke="${ink}"/><circle cx="232" cy="96" r="50" stroke="${ink}"/>`
:`<path stroke="${ink}" d="M40 92 C40 62 66 50 96 52 C126 54 140 70 138 96 C136 122 112 138 84 136 C56 134 40 120 40 92 Z"/>
<path stroke="${ink}" d="M182 96 C180 70 196 54 226 52 C258 50 282 64 282 92 C282 120 264 136 234 136 C204 136 184 122 182 96 Z"/>`}
<path stroke="${ink}" d="M112 98 L252 98"/>
<path stroke="${ink}" d="M206 44 C188 50 178 66 172 82 C164 104 152 122 140 132 C130 140 120 142 112 144"/>
<path stroke="${smile}" d="M126 168 C132 182 146 188 158 182 C168 177 178 170 186 162"/></g></svg>`;
const cards=[
 ['Your sketch, cleaned up · one colour',`<div style="width:300px">${M({ink:'#FF6B4A',smile:'#FF6B4A'})}</div>`],
 ['Ink lines, coral smile',`<div style="width:300px">${M()}</div>`],
 ['Round lenses',`<div style="width:300px">${M({round:true})}</div>`],
 ['With a lighter wordmark',`<div class="lock"><div style="width:120px">${M({sw:7})}</div><span class="word">scoo</span></div>`],
 ['App icon + small sizes (lines thicken as it shrinks)',`<div class="row"><div class="tile" style="background:#FF6B4A"><div style="width:122px">${M({ink:'#fff',smile:'#111',sw:9})}</div></div>${[48,32,16].map(s=>`<div class="fav"><div style="width:${s}px">${M({sw:s<=16?22:s<=32?16:11})}</div>${s}px</div>`).join('')}</div>`],
 ['Dark mode, like your drawing',`<div style="width:300px">${M({ink:'#FF6B4A',smile:'#FF6B4A'})}</div>`,'dark'],
];
document.getElementById('w').innerHTML=cards.map(([t,h,d])=>`<div class="card ${d||''}"><h3>${t}</h3>${h}</div>`).join('');
</script></body></html>
