<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Scoo logo</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=Inter:wght@500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#fff;font-family:Inter,sans-serif;color:#111}
.wrap{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;padding:40px;width:1360px;box-sizing:border-box}
.card{border:2px solid #111;border-radius:24px;padding:24px;display:flex;flex-direction:column;align-items:center;gap:14px;min-height:300px;justify-content:center}
.card.dark{background:#111;color:#f3f3f3;border-color:#111}
.card h3{margin:0;font-size:14px;font-weight:600;color:#666;align-self:flex-start}.card.dark h3{color:#aaa}
.lock{display:flex;align-items:center;gap:16px}
.word{font:700 64px 'Space Grotesk';letter-spacing:-2px}
.tile{width:150px;height:150px;border-radius:34px;background:#FF6B4A;display:grid;place-items:center}
.row{display:flex;gap:24px;align-items:flex-end}
.fav{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:#666}
</style></head><body><div class="wrap" id="w"></div>
<script>
// A: the letters themselves (o o glasses, s nose, c rotated into a smile)
const A=(c='#111',acc='#FF6B4A')=>`<svg viewBox="0 0 200 200" role="img" aria-label="Scoo face mark"><g fill="none" stroke="${c}" stroke-width="13" stroke-linecap="round">
<circle cx="64" cy="78" r="30"/><circle cx="136" cy="78" r="30"/><path d="M94 76 q6 -7 12 0"/></g>
<text x="100" y="140" text-anchor="middle" font-family="Space Grotesk" font-weight="700" font-size="62" fill="${c}">s</text>
<text transform="translate(100 168) rotate(-90)" text-anchor="middle" dominant-baseline="central" font-family="Space Grotesk" font-weight="700" font-size="76" fill="${acc}">c</text></svg>`;
// B: geometric, drawn as strokes so it holds up small
const B=(c='#111',acc='#FF6B4A',sw=13)=>`<svg viewBox="0 0 200 200" role="img" aria-label="Scoo face mark"><g fill="none" stroke="${c}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">
<circle cx="64" cy="80" r="30"/><circle cx="136" cy="80" r="30"/><path d="M94 78 q6 -7 12 0"/>
<path d="M109 118 c-5 -5 -18 -4 -17 4 c1 7 18 6 18 14 c0 8 -15 10 -20 4"/></g>
<path d="M64 160 a36 26 0 0 0 72 0" fill="none" stroke="${acc}" stroke-width="${sw}" stroke-linecap="round"/></svg>`;
const G=(c='#111',acc='#FF6B4A')=>`<svg viewBox="0 0 200 200" role="img" aria-label="Scoo glasses mark"><g fill="none" stroke="${c}" stroke-width="22" stroke-linecap="round"><circle cx="58" cy="92" r="38"/><circle cx="142" cy="92" r="38"/><path d="M96 90 q4 -6 8 0"/></g><path d="M70 160 a30 18 0 0 0 60 0" fill="none" stroke="${acc}" stroke-width="22" stroke-linecap="round"/></svg>`;
const cards=[
 ['B · same idea, drawn as strokes (holds up when small)',`<div style="width:220px">${B()}</div>`],
 ['B · with the wordmark',`<div class="lock"><div style="width:96px">${B()}</div><span class="word">scoo</span></div>`],
 ['B · app icon',`<div class="tile"><div style="width:118px">${B('#fff','#111')}</div></div>`],
 ['B · small sizes: full face at 64, simplified (no nose) at 32 and 16',`<div class="row"><div class="fav"><div style="width:64px">${B()}</div>64px</div>${[32,16].map(s=>`<div class="fav"><div style="width:${s}px">${G()}</div>${s}px</div>`).join('')}</div>`],
 ['B · large',`<div style="width:220px">${B()}</div>`],
 ['B · dark mode',`<div class="lock"><div style="width:96px">${B('#f3f3f3','#FF7A5C')}</div><span class="word" style="color:#f3f3f3">scoo</span></div>`,'dark'],
];
document.getElementById('w').innerHTML=cards.map(([t,h,d])=>`<div class="card ${d||''}"><h3>${t}</h3>${h}</div>`).join('');
</script></body></html>
