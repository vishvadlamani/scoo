<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Scoo logo v2</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#fff;font-family:Inter,sans-serif}
.wrap{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;padding:40px;width:1360px;box-sizing:border-box}
.card{border:2px solid #111;border-radius:24px;padding:24px;display:flex;flex-direction:column;align-items:center;gap:14px;min-height:300px;justify-content:center}
.card.dark{background:#111;border-color:#111}
.card h3{margin:0;font-size:14px;font-weight:600;color:#666;align-self:flex-start}.card.dark h3{color:#aaa}
.lock{display:flex;align-items:center;gap:14px}
.word{font:500 60px 'Space Grotesk';letter-spacing:-1px;color:#111}
.tile{width:150px;height:150px;border-radius:34px;display:grid;place-items:center}
.row{display:flex;gap:26px;align-items:flex-end}.fav{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:#666}
</style></head><body><div class="wrap" id="w"></div>
<script>
// faithful to the sketch: wide lenses, a bridge line running into both lenses,
// one long stretched "s" crossing it as the nose, a small lopsided smile
const M=({ink='#111',smile=null,sw=5}={})=>{const sm=smile||ink;return `<svg viewBox="28 26 272 196" role="img" aria-label="Scoo glasses face"><g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="${sw}">
<circle cx="92" cy="94" r="48" stroke="${ink}"/><circle cx="236" cy="94" r="48" stroke="${ink}"/>
<path stroke="${ink}" d="M140 94 L188 94"/>
<path stroke="${ink}" d="M164 150 L164 62 C164 44 178 36 194 44"/>
<path stroke="${sm}" d="M164 150 C164 192 138 212 108 208 C86 205 72 190 68 172"/></g></svg>`};
const cards=[
 ['Round lenses · hook right at the top, smile curling left',`<div style="width:300px">${M({smile:'#FF6B4A'})}</div>`],
 ['All one colour',`<div style="width:300px">${M()}</div>`],
 ['All coral',`<div style="width:300px">${M({ink:'#FF6B4A'})}</div>`],
 ['With the wordmark',`<div class="lock"><div style="width:130px">${M({sw:7,smile:'#FF6B4A'})}</div><span class="word" style="font-weight:400">scoo</span></div>`],
 ['App icon + small sizes',`<div class="row"><div class="tile" style="background:#FF6B4A"><div style="width:122px">${M({ink:'#fff',sw:9})}</div></div>${[48,32].map(s=>`<div class="fav"><div style="width:${s}px">${M({sw:s<=32?16:11,smile:'#FF6B4A'})}</div>${s}px</div>`).join('')}</div>`],
 ['On black',`<div style="width:300px">${M({ink:'#f3f3f3',smile:'#FF7A5C'})}</div>`,'dark'],
];
document.getElementById('w').innerHTML=cards.map(([t,h,d])=>`<div class="card ${d||''}"><h3>${t}</h3>${h}</div>`).join('');
</script></body></html>
